# ==============================================================================
# Grafana Dashboard Provider Configuration
# Automatically mounts declarative JSON dashboards from disk
# ==============================================================================

apiVersion: 1

providers:
  - name: 'DevOps Microservices Dashboards'
    orgId: 1
    folder: 'Microservices DevOps'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
