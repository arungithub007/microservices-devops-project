# ==============================================================================
# Prometheus Alertmanager Configuration
# Notification routing & webhook dispatch
# ==============================================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'tier', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'devops-team-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'devops-critical-alerts'
      continue: true

receivers:
  - name: 'devops-team-notifications'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  - name: 'devops-critical-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/critical-alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
