# ==============================================================================
# Host-Level Nginx Ingress & Reverse Proxy Configuration
# Traditional Fashion & Beauty Store (Sanskriti)
# Reverse Proxies: Frontend SPA, Backend API, Prometheus, and Grafana
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Upstream Definitions for Microservices & Monitoring
    upstream frontend_upstream {
        server 127.0.0.1:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream backend_upstream {
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream prometheus_upstream {
        server 127.0.0.1:9090 max_fails=2 fail_timeout=10s;
    }

    upstream grafana_upstream {
        server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    }

    # Main HTTP Server Block
    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

        # 1. Backend REST API Route
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn addr_limit 15;

            proxy_pass http://backend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 2. Prometheus Observability Route (Restricted/Internal)
        location /prometheus/ {
            proxy_pass http://prometheus_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Grafana Dashboards Route
        location /grafana/ {
            proxy_pass http://grafana_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Frontend Web Presentation SPA (Default Fallback)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Probe Endpoint
        location /nginx-health {
            access_log off;
            return 200 '{"status":"UP","service":"host-nginx-ingress"}';
            add_header Content-Type application/json;
        }
    }
}
