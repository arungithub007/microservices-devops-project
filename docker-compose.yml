# ==============================================================================
# Traditional Fashion & Beauty Store Microservices Architecture
# Orchestration: Docker Compose
# Services: Frontend (React/Nginx), Backend (Python Flask), Database (PostgreSQL)
# ==============================================================================

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

volumes:
  postgres_data:
    name: ecommerce_postgres_data
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Database Tier: PostgreSQL 15 Engine
  # ----------------------------------------------------------------------------
  database:
    image: postgres:15-alpine
    container_name: ecommerce-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./services/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecommerce_user} -d ${DB_NAME:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Application Tier: Python Flask REST API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    image: microservices-ecommerce-backend:1.0.0
    container_name: ecommerce-backend
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-securepassword123}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DATABASE_URL: postgresql://${DB_USER:-ecommerce_user}:${DB_PASSWORD:-securepassword123}@database:5432/${DB_NAME:-ecommerce_db}
      PORT: 5000
      FLASK_ENV: production
    ports:
      - "5000:5000"
    networks:
      - ecommerce-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Web Presentation Tier: ReactJS & Nginx Ingress
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    image: microservices-ecommerce-frontend:1.0.0
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - ecommerce-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
