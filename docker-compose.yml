# ==============================================================================
# Traditional Fashion & Beauty Store Microservices & Observability Architecture
# Orchestration: Docker Compose
# Services:
#   1. Database Tier: PostgreSQL 15
#   2. Application Tier: Python Flask REST API
#   3. Web Presentation Tier: ReactJS & Nginx Ingress
#   4. Monitoring Tier: Prometheus, Grafana, Node Exporter, cAdvisor
# ==============================================================================

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

volumes:
  postgres_data:
    name: ecommerce_postgres_data
    driver: local
  prometheus_data:
    name: ecommerce_prometheus_data
    driver: local
  grafana_data:
    name: ecommerce_grafana_data
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Database Tier: PostgreSQL 15 Engine
  # ----------------------------------------------------------------------------
  database:
    image: postgres:15-alpine
    container_name: ecommerce-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./services/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecommerce_user} -d ${DB_NAME:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Application Tier: Python Flask REST API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    image: microservices-ecommerce-backend:1.0.0
    container_name: ecommerce-backend
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-securepassword123}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DATABASE_URL: postgresql://${DB_USER:-ecommerce_user}:${DB_PASSWORD:-securepassword123}@database:5432/${DB_NAME:-ecommerce_db}
      PORT: 5000
      FLASK_ENV: production
    ports:
      - "5000:5000"
    networks:
      - ecommerce-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Web Presentation Tier: ReactJS & Nginx Ingress
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    image: microservices-ecommerce-frontend:1.0.0
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ecommerce-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. Observability Tier: Prometheus Server
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ecommerce-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    networks:
      - ecommerce-network

  # ----------------------------------------------------------------------------
  # 5. Observability Tier: Grafana Dashboard Server
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3000:3000"
    networks:
      - ecommerce-network
    depends_on:
      - prometheus

  # ----------------------------------------------------------------------------
  # 6. Observability Tier: Node Exporter (Host Telemetry)
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: ecommerce-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - ecommerce-network

  # ----------------------------------------------------------------------------
  # 7. Observability Tier: Google cAdvisor (Container Telemetry)
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ecommerce-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network
